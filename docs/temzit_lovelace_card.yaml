# Компактная карточка ТЭМЗИТ для главного экрана: режим, температуры, кнопка перехода к управлению.
# Только штатные карточки HA. Вставка: Изменить панель → Добавить карточку → «Вручную» → вставить.
#
# Кнопка «Управление» ведёт на вкладку с путём /lovelace/temzit (см. docs/temzit_lovelace_settings.yaml).
# Если твоя панель не «Обзор» или у вкладки другой URL — поправь navigation_path внизу.
type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 🔥 Тепловой насос ТЭМЗИТ
      **{{ states('sensor.temzit_mode_name') }}** · компрессор {{ states('sensor.temzit_compressor_active') }}
      · {{ 'облако' if is_state('switch.temzit_cloud_mode', 'on') else 'локально' }}
      {%- if states('sensor.temzit_alarm_text') not in ['ok', 'unknown', 'unavailable'] %}
      ⚠️ **Авария:** {{ states('sensor.temzit_alarm_text') }}
      {%- endif %}

  - type: glance
    columns: 4
    state_color: false
    entities:
      - entity: sensor.temzit_t_outdoor
        name: Улица
      - entity: sensor.temzit_t_room
        name: Дом
      - entity: sensor.temzit_t_supply
        name: Подача
      - entity: sensor.temzit_t_return
        name: Обратка
      - entity: sensor.temzit_t_dhw
        name: ГВС
      - entity: sensor.temzit_power_kw
        name: Мощность
      - entity: sensor.temzit_compressor_hz_1
        name: Компрессор
      - entity: sensor.temzit_set_water
        name: Уставка воды

  - type: button
    name: Управление насосом
    icon: mdi:tune-variant
    show_state: false
    icon_height: 32px
    tap_action:
      action: navigate
      navigation_path: /lovelace/temzit
